<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Desktop - Multi-Account</title>
    <link rel="stylesheet" href="../css/shell.css">
</head>
<body>
    <aside class="sidebar">
        <!-- Logo / App Icon -->
        <div class="sidebar-header" title="WhatsApp Desktop">
            <div class="logo-circle">
                <img src="../assets/icon/icon.png" alt="WhatsApp" class="app-logo">
            </div>
        </div>

        <div class="sidebar-divider"></div>

        <!-- Account List -->
        <div class="accounts-scroll-container">
            <div id="account-list" class="account-list">
                <!-- Rendered dynamically via shell.js -->
            </div>

            <!-- Add Account Button -->
            <button id="btn-add-account" class="action-btn add-btn" title="Tambah Akun WhatsApp">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                </svg>
            </button>
        </div>

        <div class="sidebar-divider"></div>

        <!-- Bottom Actions -->
        <div class="sidebar-footer">
            <button id="btn-settings" class="action-btn footer-btn" title="Pengaturan">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
            </button>
        </div>
    </aside>

    <!-- Content area: BrowserView is positioned here by Electron -->
    <main class="content-container" id="content-container">
        <div class="empty-state">
            <div class="spinner"></div>
            <p>Memuat WhatsApp Web...</p>
        </div>
    </main>

    <!-- Context Menu for Account Items -->
    <div id="context-menu" class="context-menu hidden">
        <div class="menu-item" id="menu-rename">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            <span>Ubah Nama</span>
        </div>
        <div class="menu-item" id="menu-reload">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            <span>Muat Ulang Tab</span>
        </div>
        <div class="menu-item" id="menu-clear">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
            <span>Keluar / Reset Sesi</span>
        </div>
        <div class="menu-divider"></div>
        <div class="menu-item text-danger" id="menu-delete">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            <span>Hapus Akun</span>
        </div>
    </div>

    <!-- Modal Dialog (Rename / Add / Confirm) -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-card">
            <h3 id="modal-title">Judul Modal</h3>
            <div id="modal-body">
                <input type="text" id="modal-input" class="modal-input" autocomplete="off" placeholder="Nama Akun...">
            </div>
            <div class="modal-actions">
                <button id="modal-btn-cancel" class="modal-btn btn-secondary">Batal</button>
                <button id="modal-btn-confirm" class="modal-btn btn-primary">Simpan</button>
            </div>
        </div>
    </div>

    <script src="../js/views/shell.js"></script>
</body>
</html>
